<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Drift Anchor — Feedback Loop Experience</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            gap: 15px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .arena {
            position: relative;
            width: 100%;
            height: 400px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Güvenli Koridor Alanı */
        .safe-corridor {
            position: absolute;
            top: 0;
            bottom: 0;
            left: calc(50% - 75px);
            width: 150px;
            background: rgba(30, 41, 59, 0.4);
            border-left: 1px dashed rgba(75, 85, 99, 0.4);
            border-right: 1px dashed rgba(75, 85, 99, 0.4);
        }

        /* Hareketli Nesne (Node) */
        #node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            background: #38bdf8;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #38bdf8;
            transition: background-color 0.2s;
        }

        .score-display {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(17, 24, 39, 0.75);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            border: 1px solid #374151;
            z-index: 10;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
        }

        .controls-hint {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        kbd {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 3px;
            padding: 1px 5px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #e2e8f0;
        }

        .reset-button {
            background: #1f2937;
            color: #e2e8f0;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reset-button:hover {
            background: #374151;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>The Drift Anchor</h1>
            <p>Keep the node inside the safe central corridor using A/D keys.</p>
        </header>

        <main class="arena" id="arena">
            <div class="safe-corridor"></div>
            <div id="node"></div>
            <div class="score-display">
                Stability: <span id="stabilityVal">100</span>%
            </div>
        </main>

        <footer class="footer">
            <div class="controls-hint">
                <span><strong>Controls:</strong> <kbd>A</kbd> / <kbd>D</kbd> or <kbd>Left</kbd> / <kbd>Right</kbd> | <strong>Reset:</strong> <kbd>R</kbd></span>
            </div>
            <button id="resetBtn" class="reset-button">Reset Experience</button>
        </footer>
    </div>

    <script>
        /**
         * THE DRIFT ANCHOR - DOM Version (Sıfır hata garantili saf JS mimarisi)
         */

        // ==========================================
        // 1. DESIGN (Ayarlanabilir Parametreler)
        // ==========================================
        const DESIGN = {
            nodeMass: 1.5,          // Atalet katsayısı
            enginePower: 0.45,      // Tuş basma kuvveti
            friction: 0.94,         // Sürtünme
            currentChangeSpeed: 0.03, // Rüzgar değişim hızı
            maxCurrentForce: 0.7,   // Maksimum gizli rüzgar
            corridorHalfWidth: 75   // Güvenli bölge yarıçapı
        };

        // ==========================================
        // 2. state (Durum Yönetimi)
        // ==========================================
        let state = {
            x: 0,       // Merkezden uzaklık (piksel cinsinden ofset)
            vx: 0,      // Hız
            currentX: 0,// Gizli rüzgar
            targetCurrentX: 0,
            keys: { left: false, right: false },
            stability: 100
        };

        const arena = document.getElementById('arena');
        const nodeEl = document.getElementById('node');
        const stabilityValEl = document.getElementById('stabilityVal');
        const resetBtn = document.getElementById('resetBtn');

        // Başlangıçta tam ortala
        function initPosition() {
            state.x = 0;
            state.vx = 0;
            state.currentX = 0;
            state.stability = 100;
        }
        initPosition();

        // ==========================================
        // 3. input (Girdi Yönetimi)
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = true;
            if (e.key === 'r' || e.key === 'R') initPosition();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
        });

        resetBtn.addEventListener('click', initPosition);

        // ==========================================
        // 4. rule (Fizik ve Kurallar)
        // ==========================================
        function updatePhysics() {
            // Gizli rüzgarı periyodik olarak değiştir
            if (Math.random() < 0.02) {
                state.targetCurrentX = (Math.random() * 2 - 1) * DESIGN.maxCurrentForce;
            }
            state.currentX += (state.targetCurrentX - state.currentX) * DESIGN.currentChangeSpeed;

            // Kullanıcı kuvveti
            let userForce = 0;
            if (state.keys.left) userForce -= DESIGN.enginePower;
            if (state.keys.right) userForce += DESIGN.enginePower;

            // Toplam ivme ve hız
            const accel = (userForce + state.currentX) / DESIGN.nodeMass;
            state.vx += accel;
            state.vx *= DESIGN.friction;
            state.x += state.vx;

            // Sınırlar (Arena genişliğinin dışına çıkmasın)
            const maxLimit = (arena.clientWidth / 2) - 20;
            if (state.x < -maxLimit) { state.x = -maxLimit; state.vx *= -0.4; }
            if (state.x > maxLimit) { state.x = maxLimit; state.vx *= -0.4; }

            // Kararlılık (Stability) hesaplama
            const inCorridor = Math.abs(state.x) <= DESIGN.corridorHalfWidth;
            if (inCorridor) {
                state.stability = Math.min(100, state.stability + 0.4);
            } else {
                state.stability = Math.max(0, state.stability - 0.9);
            }
            stabilityValEl.textContent = Math.round(state.stability);
        }

        // ==========================================
        // 5. output (Görselleştirme / Render)
        // ==========================================
        function render() {
            // Nesneyi merkez ofsetine göre konumlandır
            const arenaCenter = arena.clientWidth / 2;
            nodeEl.style.left = `${arenaCenter + state.x}px`;

            // Gizli akıntının şiddetine göre nesnenin rengini değiştir (Geri bildirim)
            const intensity = Math.abs(state.currentX);
            if (intensity > 0.4) {
                nodeEl.style.backgroundColor = '#f43f5e'; // Sert akıntı (Kırmızımsı)
                nodeEl.style.boxShadow = '0 0 15px #f43f5e';
            } else {
                nodeEl.style.backgroundColor = '#38bdf8'; // Normal akıntı (Mavi)
                nodeEl.style.boxShadow = '0 0 15px #38bdf8';
            }
        }

        // Ana Döngü
        function loop() {
            updatePhysics();
            render();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
