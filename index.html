<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Trace & Feedback Experiment</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --surface-color: #161616;
            --border-color: #2c2c2c;
            --text-primary: #f0f0f0;
            --text-secondary: #888888;
            --accent: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .experiment-container {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }

        .experiment-header {
            margin-bottom: 1rem;
        }

        .experiment-header h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .canvas-wrapper {
            position: relative;
            background: #050505;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1rem;
            height: 360px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .status-banner {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(22, 22, 22, 0.85);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
        }

        .experiment-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .metrics {
            display: flex;
            gap: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .metrics strong {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <main class="experiment-container">
        <header class="experiment-header">
            <h1>Persistent Trace & Feedback</h1>
            <p class="subtitle">Drag across the canvas to paint and accumulate selection paths. Visited nodes turn green and persist.</p>
        </header>

        <div class="canvas-wrapper">
            <canvas id="trailCanvas"></canvas>
            <div id="statusBanner" class="status-banner" aria-live="polite">State: Ready (Draw to trace)</div>
        </div>

        <footer class="experiment-footer">
            <button id="clearBtn" class="btn">Clear Trails</button>
            <div class="metrics">
                <span>Active Traces: <strong id="traceCountVal">0</strong></span>
                <span>System Memory: <strong id="memoryVal">Clean</strong></span>
            </div>
        </footer>
    </main>

    <script>
        const DESIGN = {
            gridSpacing: 25,
            selectionRadius: 35,
            colors: {
                background: '#050505',
                nodeDefault: 'rgba(255, 255, 255, 0.12)',
                nodeSelected: '#22c55e',
                cursorTrail: 'rgba(34, 197, 94, 0.4)'
            }
        };

        let state = {
            nodes: [],
            isDrawing: false,
            lastX: 0,
            lastY: 0,
            activeTracesCount: 0
        };

        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const statusBanner = document.getElementById('statusBanner');
        const traceCountVal = document.getElementById('traceCountVal');
        const memoryVal = document.getElementById('memoryVal');

        function initGrid() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            state.nodes = [];
            for (let x = DESIGN.gridSpacing; x < canvas.width; x += DESIGN.gridSpacing) {
                for (let y = DESIGN.gridSpacing; y < canvas.height; y += DESIGN.gridSpacing) {
                    state.nodes.push({
                        x: x,
                        y: y,
                        selected: false,
                        intensity: 0.0
                    });
                }
            }
            state.activeTracesCount = 0;
            updateMetrics();
        }

        function initInput() {
            canvas.addEventListener('pointerdown', (e) => {
                state.isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                state.lastX = e.clientX - rect.left;
                state.lastY = e.clientY - rect.top;
                processSelection(state.lastX, state.lastY);
                statusBanner.textContent = "State: Tracing & Accumulating Data";
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!state.isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;

                processSelection(x, y);
                state.lastX = x;
                state.lastY = y;
            });

            window.addEventListener('pointerup', () => {
                state.isDrawing = false;
                statusBanner.textContent = "State: Idle (Selections Preserved)";
            });

            clearBtn.addEventListener('click', () => {
                state.nodes.forEach(n => {
                    n.selected = false;
                    n.intensity = 0.0;
                });
                state.activeTracesCount = 0;
                updateMetrics();
                statusBanner.textContent = "State: Memory Cleared";
            });
        }

        function processSelection(x, y) {
            state.nodes.forEach(node => {
                let dx = node.x - x;
                let dy = node.y - y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < DESIGN.selectionRadius) {
                    if (!node.selected) {
                        node.selected = true;
                        state.activeTracesCount++;
                    }
                    node.intensity = 1.0;
                }
            });
            updateMetrics();
        }

        function updatePhysics() {
            state.nodes.forEach(node => {
                if (node.intensity > 0.0) {
                    node.intensity -= 0.02;
                    if (node.intensity < 0.0) node.intensity = 0.0;
                }
            });
        }

        function renderOutput() {
            ctx.fillStyle = DESIGN.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            state.nodes.forEach(node => {
                ctx.beginPath();
                if (node.selected) {
                    let radius = 3 + (node.intensity * 3);
                    ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = DESIGN.colors.nodeSelected;
                    ctx.shadowColor = DESIGN.colors.nodeSelected;
                    ctx.shadowBlur = 8 * node.intensity;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.arc(node.x, node.y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = DESIGN.colors.nodeDefault;
                    ctx.fill();
                }
            });
        }

        function updateMetrics() {
            traceCountVal.textContent = state.activeTracesCount;
            memoryVal.textContent = state.activeTracesCount > 50 ? "Dense (Accumulating)" : state.activeTracesCount > 0 ? "Active" : "Clean";
        }

        function loop() {
            updatePhysics();
            renderOutput();
            requestAnimationFrame(loop);
        }

        window.addEventListener('load', () => {
            initGrid();
            initInput();
            loop();
        });
    </script>
</body>
</html>
